{% extends "base.html" %}
{% block titolo %}Registrati — Fast Mentoring{% endblock %}
{% block contenuto %}
<div class="scheda-form">
  <h1>Crea il tuo account</h1>
  {% if errore %}<p class="errore">{{ errore }}</p>{% endif %}
  <form method="post" action="/registrati">
    <label>Nome e cognome<input type="text" name="nome" required autofocus></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Ente / organizzazione<input type="text" name="ente"></label>
    <label>Password (almeno 8 caratteri)<input type="password" name="password" minlength="8" required></label>
    <button type="submit">Registrati</button>
  </form>
  <p>Hai gia' un account? <a href="/accedi">Accedi</a></p>
</div>
{% endblock %}
